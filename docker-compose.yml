services:
  mc-autostart:
    build:
      context: .
      dockerfile: Dockerfile
    image: crafty-mc-autostart:latest
    container_name: crafty-mc-autostart
    restart: always
    env_file:
      - .env
    ports:
      # Port public 25565 redirigé vers le port d'écoute configuré dans le .env
      - "${LISTEN_PORT:-25565}:${LISTEN_PORT:-25565}"
    # Permet au conteneur de communiquer directement avec la machine hôte (Crafty / Minecraft)
    extra_hosts:
      - "host.docker.internal:host-gateway"
